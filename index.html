<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adou · 域名收藏夹</title>

    <!-- ═══════════════════════════════════════════
         配置区：想改名字 / 社交链接，只改下面这一块
         ═══════════════════════════════════════════ -->
    <script>
        // 显示的名字
        const SITE_NAME = "adou";

        // 社交链接：icon 用 Font Awesome 图标名，url 用 # 或留空则不显示
        const SOCIAL_LINKS = [
            { icon: "fa-brands fa-github",    url: "https://github.com/alivedou", label: "GitHub" },
            { icon: "fa-brands fa-blogger-b", url: "https://x.com/",             label: "Blog" },
            { icon: "fa-solid fa-envelope",   url: "mailto:you@example.com",     label: "邮箱" },
            { icon: "fa-brands fa-telegram",  url: "https://t.me/",              label: "Telegram" },
        ];

        // ── 背景图配置 ───────────────────────────────
        // 背景模式：
        //   "bing"      必应每日壁纸（大陆可访问，默认）
        //   "wallhaven" Wallhaven 高清壁纸（图质量最高，但大陆被墙需梯子；失败自动回退必应）
        //   "picsum"    Lorem Picsum 随机图库（随机风景，适合想看变化）
        //   "custom"    用下面 BG_CUSTOM_URL 你自己的高清大图直链
        //   "none"      默认深青绿渐变（不加载图）
        const BG_MODE = "bing";

        // custom 模式：填你自己的高清大图直链（jpg/png/webp）
        const BG_CUSTOM_URL = "";

        // wallhaven 模式：API key（https://wallhaven.cc/settings/account 免费生成），
        // 留空也能用但有限频；填了更稳
        const BG_WALLHAVEN_KEY = "";

        // bing 清晰度："UHD"(4K 超清，推荐) 或 "1920x1080"(加载更快)
        const BG_BING_SIZE = "UHD";

        // 定时自动换图间隔（分钟）。0 = 只在打开时加载一张，不自动换
        // bing 每天只更新一张，设 60 即可；picsum / wallhaven 想多看变化设 10~30
        const BG_REFRESH_MIN = 60;
        // ── 背景图配置结束 ───────────────────────────
    </script>
    <!-- ═══════════════ 配置区结束 ═══════════════ -->

    <link rel="stylesheet" href="style.css">

    <!-- 大时钟字体（科技感数字） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome（社交图标） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- 背景层（由顶部背景配置动态渲染） -->
    <div class="bg-layer" id="bg-layer"></div>

    <div class="overlay">

        <!-- 名字（由顶部 SITE_NAME 填充） -->
        <h1 class="name" id="site-name">adou</h1>

        <!-- 大时钟（主视觉） -->
        <div class="clock">
            <div id="clock-time" class="clock-time">00:00:00</div>
            <div id="clock-date" class="clock-date">----年--月--日 星期-</div>
        </div>

        <!-- 当前访问域名 -->
        <div class="domain-box">
            <span id="domain"></span>
        </div>

        <!-- 社交（由顶部 SOCIAL_LINKS 动态生成） -->
        <div class="social" id="social"></div>

        <!-- Power -->
        <p class="power" id="power-text">
            ©2026 Power by adou
        </p>

    </div>

    <!-- 底部：IP + 国家 -->
    <div class="footer">
        <div id="ip">Loading...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
